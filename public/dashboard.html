<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Oluwasegun Design System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">O</div>
      <div class="sidebar-logo-text">
        <h6>Oluwasegun</h6>
        <span>Design System</span>
      </div>
    </div>
    <div class="sidebar-divider"></div>
    <ul class="sidebar-nav">
      <li class="sidebar-nav-item"><a href="/dashboard.html" class="sidebar-nav-link active">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        <span>Dashboard</span></a></li>
      <li class="sidebar-nav-item"><a href="/analytics.html" class="sidebar-nav-link">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
        <span>Analytics</span></a></li>
      <li class="sidebar-nav-item"><a href="/users.html" class="sidebar-nav-link">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <span>Users</span></a></li>
      <li class="sidebar-nav-item"><a href="/settings.html" class="sidebar-nav-link">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <span>Settings</span></a></li>
    </ul>
    <div class="sidebar-divider"></div>
    <div class="sidebar-toggle" id="sidebar-toggle">
      <button title="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Main area -->
  <div class="main-area">
    <header class="topbar">
      <button class="topbar-hamburger" id="hamburger-btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
      <div class="topbar-search">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" placeholder="Search...">
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button class="topbar-icon-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
          <span class="notification-dot"></span>
        </button>
        <div class="topbar-avatar" id="user-avatar">O</div>
      </div>
      <div class="user-menu" id="user-menu">
        <button class="user-menu-item">Profile</button>
        <button class="user-menu-item">Settings</button>
        <button class="user-menu-item" onclick="location.href='/login.html'">Logout</button>
      </div>
    </header>

    <main class="main-content">
      <div class="mb-3">
        <h5 class="h5 mb-0-5">Dashboard</h5>
        <p class="body2 text-secondary">Welcome back. Here's what's happening with your platform.</p>
      </div>

      <div class="flex flex-col gap-2-5">
        <!-- KPI Cards -->
        <div class="grid grid-4" id="kpi-grid"></div>

        <!-- Charts -->
        <div class="grid grid-8-4">
          <div class="card">
            <div class="card-content">
              <p class="subtitle2 mb-2">Revenue Overview</p>
              <div style="height:280px"><canvas id="revenue-chart"></canvas></div>
            </div>
          </div>
          <div class="card">
            <div class="card-content">
              <p class="subtitle2 mb-2">Visitors & Sessions</p>
              <div style="height:280px"><canvas id="visitors-chart"></canvas></div>
            </div>
          </div>
        </div>

        <!-- Activity -->
        <div class="card">
          <div class="card-content">
            <div class="flex items-center justify-between mb-2">
              <p class="subtitle2">Recent Activity</p>
              <a href="/analytics.html" class="caption text-primary-color font-600 cursor-pointer">View all</a>
            </div>
            <div id="activity-list"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="snackbar" id="snackbar"></div>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
