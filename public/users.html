<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="sidebar-logo-icon">O</div><div class="sidebar-logo-text"><h6>Oluwasegun</h6><span>Design System</span></div></div>
    <div class="sidebar-divider"></div>
    <ul class="sidebar-nav">
      <li class="sidebar-nav-item"><a href="/dashboard.html" class="sidebar-nav-link"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg><span>Dashboard</span></a></li>
      <li class="sidebar-nav-item"><a href="/analytics.html" class="sidebar-nav-link"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg><span>Analytics</span></a></li>
      <li class="sidebar-nav-item"><a href="/users.html" class="sidebar-nav-link active"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span>Users</span></a></li>
      <li class="sidebar-nav-item"><a href="/settings.html" class="sidebar-nav-link"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg><span>Settings</span></a></li>
    </ul>
    <div class="sidebar-divider"></div>
    <div class="sidebar-toggle" id="sidebar-toggle"><button><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button></div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="main-area">
    <header class="topbar">
      <button class="topbar-hamburger" id="hamburger-btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
      <div class="topbar-search"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input type="text" placeholder="Search..."></div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button class="topbar-icon-btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg><span class="notification-dot"></span></button>
        <div class="topbar-avatar" id="user-avatar">O</div>
      </div>
      <div class="user-menu" id="user-menu">
        <button class="user-menu-item">Profile</button>
        <button class="user-menu-item">Settings</button>
        <button class="user-menu-item" onclick="location.href='/login.html'">Logout</button>
      </div>
    </header>

    <main class="main-content">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h5 class="h5 mb-0-5">User Management</h5>
          <p class="body2 text-secondary">Manage platform users and their roles.</p>
        </div>
        <button class="btn btn-primary" id="add-user-btn">
          <svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          Add User
        </button>
      </div>

      <div class="card">
        <div class="card-content">
          <div class="flex gap-1-5 mb-2-5">
            <div style="flex:1;max-width:360px">
              <input type="text" id="search-input" class="form-input" placeholder="Search users..." style="padding-left:36px;background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22%3E%3Cpath fill=%22%2379747E%22 d=%22M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z%22/%3E%3C/svg%3E');background-repeat:no-repeat;background-position:10px center">
            </div>
            <select id="role-filter" class="form-input form-select" style="width:130px;padding:6px 32px 6px 12px">
              <option value="all">All Roles</option>
              <option value="Admin">Admin</option>
              <option value="Manager">Manager</option>
              <option value="User">User</option>
            </select>
          </div>
          <div id="users-table"><div class="loading"><div class="spinner"></div></div></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Dialog -->
<div class="dialog-overlay" id="dialog-overlay">
  <div class="dialog">
    <div class="dialog-header" id="dialog-title">Add User</div>
    <div class="dialog-body">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="form-name" class="form-input" placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="form-email" class="form-input" placeholder="you@company.com">
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="form-role" class="form-input form-select" style="padding:6px 32px 6px 12px">
          <option value="Admin">Admin</option>
          <option value="Manager">Manager</option>
          <option value="User" selected>User</option>
        </select>
      </div>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-text" id="dialog-cancel">Cancel</button>
      <button class="btn btn-primary" id="dialog-submit">Create</button>
    </div>
  </div>
</div>

<div class="snackbar" id="snackbar"></div>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/users.js"></script>
</body>
</html>
